<style>
  :root { --navy:#1b3456; --teal:#4ba69b; --teal-lt:#e4f2f0; --navy-lt:#eaeff5; --ink:#222; --mute:#5a6472; --rule:#cfd8e0; --bg:#f4f6f8; --amber:#fff4d6; --amber-b:#e0a800; }
  * { box-sizing: border-box; }
  html, body { margin:0; padding:0; background: var(--bg); }
  body { font-family: "Noto Sans", "Noto Sans KR", Arial, sans-serif; font-size: 16px; line-height: 1.5; color: var(--ink); -webkit-text-size-adjust: 100%; }
  html[lang="ko"] body { font-family: "Noto Sans KR", "Noto Sans", sans-serif; }
  h1, h2, h3, h4 { font-family: "Noto Serif", Georgia, serif; color: var(--navy); margin: 0; line-height: 1.25; }
  html[lang="ko"] h1, html[lang="ko"] h2, html[lang="ko"] h3 { font-family: "Noto Sans KR", sans-serif; }
  h1 { font-size: 1.6rem; font-weight: 700; }
  h2 { font-size: 1.35rem; font-weight: 700; }
  h3 { font-size: 1.1rem; font-weight: 700; margin: 1rem 0 .3rem 0; }
  h4 { font-size: 1rem; font-weight: 700; margin: .9rem 0 .25rem 0; font-family: "Noto Sans", "Noto Sans KR", sans-serif; }
  p { margin: 0 0 .6rem 0; }
  ul { margin: 0 0 .6rem 0; padding-left: 1.3rem; }
  li { margin: 0 0 .3rem 0; }
  strong { color: var(--navy); }
  a { color: var(--navy); }
  button { font: inherit; }

  /* ---- header ---- */
  .top { position: sticky; top: 0; z-index: 20; background: #fff; border-bottom: 1px solid var(--rule); box-shadow: 0 1px 4px rgba(0,0,0,.06); }
  .top .bar { max-width: 960px; margin: 0 auto; padding: .45rem .8rem; display: flex; align-items: center; gap: .6rem; flex-wrap: wrap; }
  .iconbtn { width: 46px; height: 46px; border: 0; padding: 0; background: none; cursor: pointer; border-radius: 12px; flex: 0 0 auto; }
  .iconbtn img { width: 46px; height: 46px; border-radius: 12px; display:block; }
  .appname { font-family: "Noto Serif", Georgia, serif; color: var(--navy); font-weight: 700; font-size: 1.05rem; flex: 1 1 auto; white-space: nowrap; cursor: pointer; }
  .sel { display: flex; flex-direction: column; font-size: .68rem; color: var(--mute); text-transform: uppercase; letter-spacing: .06em; }
  .sel select { font: inherit; font-size: .95rem; text-transform: none; letter-spacing: 0; color: var(--navy); font-weight: 700; border: 1px solid var(--rule); border-radius: 8px; padding: .35rem .5rem; background: #fff; max-width: 46vw; }
  .selrow { display: flex; gap: .6rem; }
  @media (max-width: 560px) { .selrow { width: 100%; } .sel { flex: 1 1 0; } .sel select { max-width: 100%; width: 100%; } }
  .search { display: flex; gap: .4rem; width: 100%; }
  .search input { flex: 1 1 auto; font: inherit; font-size: 1rem; border: 1px solid var(--rule); border-radius: 10px; padding: .5rem .8rem; min-width: 0; }
  .search button { font-weight: 700; color: #fff; background: var(--navy); border: 0; border-radius: 10px; padding: .5rem 1rem; cursor: pointer; }

  main { max-width: 960px; margin: 0 auto; padding: 1rem .8rem 3rem .8rem; }
  .screen { display: none; }
  .screen.active { display: block; }
  .back { display: inline-flex; align-items: center; gap: .4rem; background: none; border: 0; color: var(--navy); font-weight: 700; padding: .3rem 0; margin-bottom: .6rem; cursor: pointer; }
  .back::before { content: "\2190"; font-size: 1.2rem; }
  .card { background: #fff; border-radius: 12px; padding: 1.1rem 1rem; box-shadow: 0 1px 3px rgba(0,0,0,.06); margin-bottom: 1rem; }
  @media (min-width: 700px) { .card { padding: 1.4rem 1.6rem; } }

  /* ---- home ---- */
  .hero { display: grid; grid-template-columns: 1fr; gap: .8rem; align-items: center; }
  @media (min-width: 640px) { .hero { grid-template-columns: 1fr auto; } }
  .hero img { width: min(300px, 80%); display: block; }
  .hero .who { font-size: .9rem; color: var(--mute); margin: .3rem 0 0 0; }
  .callbtn { display: inline-flex; flex-direction: column; align-items: center; text-decoration: none; background: var(--navy); color: #fff; border-radius: 14px; padding: .7rem 1.3rem; min-width: 200px; }
  .callbtn b { font-size: 1.35rem; font-family: "Noto Serif", Georgia, serif; letter-spacing: .01em; }
  .callbtn span { font-size: .78rem; opacity: .85; text-transform: uppercase; letter-spacing: .08em; }
  .herorow { display: flex; flex-direction: column; gap: .5rem; align-items: stretch; }
  .linkbtn { display: inline-block; text-align: center; text-decoration: none; color: var(--navy); background: var(--navy-lt); border-radius: 12px; padding: .55rem 1rem; font-weight: 700; border: 0; cursor: pointer; }
  .sectitle { font-size: .78rem; letter-spacing: .14em; text-transform: uppercase; color: var(--teal); font-weight: 700; margin: 1.2rem 0 .5rem 0; }
  .tiles { display: grid; grid-template-columns: 1fr 1fr; gap: .7rem; }
  @media (min-width: 640px) { .tiles { grid-template-columns: repeat(3, 1fr); } }
  @media (min-width: 900px) { .tiles { grid-template-columns: repeat(4, 1fr); } }
  .tile { display: flex; flex-direction: column; align-items: flex-start; gap: .5rem; text-align: left; background: #fff; border: 1px solid var(--rule); border-radius: 14px; padding: .9rem .9rem; cursor: pointer; min-height: 118px; box-shadow: 0 1px 3px rgba(0,0,0,.05); transition: transform .1s, box-shadow .1s; color: var(--ink); }
  .tile:hover, .tile:focus { box-shadow: 0 4px 14px rgba(27,52,86,.14); transform: translateY(-1px); border-color: var(--teal); }
  .tile .ic { width: 40px; height: 40px; border-radius: 12px; background: var(--teal-lt); color: var(--teal); display: flex; align-items: center; justify-content: center; }
  .tile .ic svg { width: 24px; height: 24px; stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
  .tile.tool .ic { background: var(--navy-lt); color: var(--navy); }
  .tile b { font-family: "Noto Serif", Georgia, serif; color: var(--navy); font-size: 1.02rem; line-height: 1.25; }
  html[lang="ko"] .tile b { font-family: "Noto Sans KR", sans-serif; }
  .tile small { color: var(--mute); font-size: .8rem; line-height: 1.3; }

  /* ---- topic screen ---- */
  .topic h1 { margin-bottom: .4rem; }
  .pagehead { font-family: "Noto Serif", Georgia, serif; color: var(--teal); font-size: 1.05rem; margin: 1.2rem 0 .5rem 0; }
  .intro { margin-bottom: .8rem; }
  .acc { background: #fff; border: 1px solid var(--rule); border-radius: 12px; margin-bottom: .6rem; overflow: hidden; }
  .acc > button { display: flex; width: 100%; align-items: center; justify-content: space-between; gap: .8rem; text-align: left; background: none; border: 0; padding: .9rem 1rem; cursor: pointer; color: var(--navy); font-weight: 700; font-size: 1.02rem; }
  .acc > button::after { content: "+"; font-size: 1.4rem; line-height: 1; color: var(--teal); flex: 0 0 auto; }
  .acc.open > button::after { content: "\2212"; }
  .acc > button:hover { background: var(--navy-lt); }
  .acc .ac { display: none; padding: 0 1rem 1rem 1rem; border-top: 1px solid var(--rule); }
  .acc.open .ac { display: block; }
  .ac > :first-child { margin-top: .8rem; }
  .ac h4:first-child { margin-top: .8rem; }
  .card-body.warn { border-left: 4px solid var(--navy); padding-left: .8rem; }
  .card-body.callout { background: var(--teal-lt); padding: .8rem; border-radius: 8px; margin-top: .8rem; }
  .card-body.callout.navy { background: var(--navy-lt); }
  .srcbox { margin-top: 1rem; }
  .srcbox summary { cursor: pointer; color: var(--mute); font-size: .85rem; font-weight: 700; }
  .srcbox .src { font-size: .8rem; color: var(--mute); margin: .4rem 0 .6rem 0; line-height: 1.4; }
  .rowbtns { display: flex; gap: .5rem; flex-wrap: wrap; margin: .5rem 0 1rem 0; }
  .rowbtns button { background: var(--navy-lt); color: var(--navy); border: 0; border-radius: 8px; padding: .35rem .8rem; cursor: pointer; font-size: .85rem; font-weight: 700; }

  /* content styles (from the packet) */
  .section-label { display: none; }
  .callout { background: var(--teal-lt); border-left: 5px solid var(--teal); padding: .7rem .9rem; margin: .7rem 0; border-radius: 6px; }
  .callout.navy { background: var(--navy-lt); border-left-color: var(--navy); }
  .callout h4 { margin-top: 0; }
  .callout ul:last-child, .callout p:last-child { margin-bottom: 0; }
  .two { column-count: 1; }
  .grid2, .grid3 { display: grid; grid-template-columns: 1fr; gap: .9rem 1.4rem; }
  @media (min-width: 700px) { .grid2 { grid-template-columns: 1fr 1fr; } .two { column-count: 2; column-gap: 2rem; } }
  .avoid { font-size: .95rem; color: var(--navy); font-weight: 700; margin-top: .6rem; }
  table { border-collapse: collapse; width: 100%; font-size: .92rem; margin: .4rem 0 .9rem 0; }
  th, td { text-align: left; padding: .35rem .5rem; border-bottom: 1px solid var(--rule); vertical-align: top; }
  th { background: var(--navy-lt); color: var(--navy); font-weight: 700; }
  .qrrow { display:flex; align-items:center; gap: .8rem; margin-top: .9rem; padding: .8rem 1rem; background: var(--navy-lt); border-radius: 10px; }
  a.qrrow.link { text-decoration: none; color: var(--ink); border: 2px solid var(--navy); background: #fff; }
  a.qrrow.link:hover { background: var(--navy-lt); }
  a.qrrow.link > div { flex: 1 1 auto; min-width: 0; overflow-wrap: anywhere; }
  a.qrrow.link .arrow { font-size: 1.4rem; color: var(--teal); flex: 0 0 auto; }
  .classes .row { display: grid; grid-template-columns: 1fr; gap: .25rem; padding: .7rem 0; border-bottom: 1px dotted var(--rule); }
  @media (min-width: 700px) { .classes .row { grid-template-columns: 220px 1fr; gap: 1rem; } }
  .classes .row b { font-family: "Noto Serif", Georgia, serif; color: var(--navy); font-size: 1.1rem; }
  .pos { display: grid; grid-template-columns: 1fr; gap: 1rem 1.4rem; }
  @media (min-width: 700px) { .pos { grid-template-columns: 1fr 1fr; } }
  .pos .item { display: grid; grid-template-columns: 110px 1fr; gap: .8rem; align-items: start; }
  .pos img { width: 110px; border-radius: 6px; }
  .ref { font-size: .85rem; line-height: 1.35; }
  .ref ol { padding-left: 1.4rem; margin: 0; }
  .ref li { margin-bottom: .35rem; }
  .small { font-size: .88rem; color: var(--mute); }
  .note { font-size: .9rem; color: var(--mute); font-style: italic; }
  .big { font-size: 1.08rem; }
  .pcard { display:grid; grid-template-columns: 86px 1fr; gap: .7rem; align-items:start; border: 1px solid var(--rule); border-top: 4px solid var(--teal); border-radius: 8px; padding: .6rem .7rem; }
  .pcard .photo { width:86px; height:104px; background: var(--navy-lt); border-radius: 6px; overflow:hidden; }
  a.pcard.link { text-decoration: none; color: var(--ink); cursor: pointer; transition: box-shadow .1s, transform .1s; }
  a.pcard.link:hover, a.pcard.link:focus { box-shadow: 0 4px 14px rgba(27,52,86,.14); transform: translateY(-1px); border-color: var(--teal); }
  a.pcard.link .book { display: inline-block; margin-top: .3rem; color: #fff; background: var(--teal); border-radius: 8px; padding: .25rem .65rem; font-weight: 700; font-size: .85rem; }
  .pcard .photo img { width:100%; height:100%; object-fit:cover; display:block; }
  .phone { font-family: "Noto Serif", Georgia, serif; font-size: 1.5rem; color: var(--navy); font-weight: 700; }
  .phone a { text-decoration: none; }
  body:not(.wch):not(.fc) .wch-only { display: none; }
  mark { background: #ffe58a; color: inherit; padding: 0 .1em; border-radius: 2px; }

  /* ---- team screen ---- */
  .cover-logo { width: min(320px, 80%); display:block; margin: 0 0 1.2rem 0; }
  .team { display: grid; grid-template-columns: 1fr 1fr; gap: .8rem 1rem; margin: .6rem 0 1rem 0; font-size: .95rem; }
  @media (min-width: 700px) { .team { grid-template-columns: repeat(3, 1fr); } }
  .mem { display: flex; align-items: center; gap: .55rem; margin: 0 0 .45rem 0; line-height: 1.25; }
  .mem img, .mem .ini { width: 42px; height: 50px; border-radius: 8px; object-fit: cover; flex: 0 0 auto; background: var(--navy-lt); }
  .mem .ini { display: flex; align-items: center; justify-content: center; color: var(--navy); font-weight: 700; font-size: .85rem; }
  .docrow { display: flex; align-items: center; gap: .8rem; margin-top: .6rem; }
  .docrow img { width: 72px; height: 87px; border-radius: 10px; object-fit: cover; flex: 0 0 auto; }
  .docrow .who { margin: 0; }
  .team b { display:block; color: var(--teal); font-size: .78rem; letter-spacing: .08em; text-transform: uppercase; margin-bottom: .2rem; }
  .offices { display: grid; grid-template-columns: 1fr; gap: .6rem; margin: .5rem 0 1rem 0; }
  @media (min-width: 600px) { .offices { grid-template-columns: repeat(2, 1fr); } }
  @media (min-width: 860px) { .offices { grid-template-columns: repeat(3, 1fr); } }
  .office { border: 1px solid var(--rule); border-top: 4px solid var(--teal); border-radius: 8px; padding: .6rem .8rem; font-size: .92rem; line-height: 1.4; }
  .office b { color: var(--navy); }
  .office .docs { color: var(--mute); font-size: .85rem; }

  /* ---- tools ---- */
  .field { display: flex; flex-direction: column; gap: .25rem; margin-bottom: .8rem; }
  .field label { font-size: .8rem; color: var(--mute); text-transform: uppercase; letter-spacing: .06em; font-weight: 700; }
  .field input, .field select { font: inherit; font-size: 1.05rem; border: 1px solid var(--rule); border-radius: 10px; padding: .5rem .7rem; background: #fff; }
  .field .pair { display: flex; gap: .5rem; }
  .field .pair input { flex: 1 1 0; min-width: 0; }
  .stat { display: grid; grid-template-columns: 1fr 1fr; gap: .6rem; margin: .6rem 0 1rem 0; }
  .stat div { background: var(--navy-lt); border-radius: 10px; padding: .7rem .8rem; }
  .stat b { display: block; font-family: "Noto Serif", Georgia, serif; color: var(--navy); font-size: 1.3rem; }
  .stat span { font-size: .8rem; color: var(--mute); text-transform: uppercase; letter-spacing: .06em; }
  .chk { list-style: none; padding: 0; margin: 0; }
  .chk li { display: flex; gap: .7rem; align-items: flex-start; padding: .55rem 0; border-bottom: 1px solid var(--rule); }
  .chk .dot { flex: 0 0 auto; width: 14px; height: 14px; border-radius: 50%; margin-top: .35rem; background: var(--rule); }
  .chk li.now .dot { background: var(--teal); box-shadow: 0 0 0 4px var(--teal-lt); }
  .chk li.past .dot { background: var(--navy); }
  .chk li.now { background: var(--teal-lt); margin: 0 -.5rem; padding: .55rem .5rem; border-radius: 8px; }
  .chk .w { font-size: .8rem; color: var(--mute); display: block; }
  .chk .tag { font-size: .7rem; text-transform: uppercase; letter-spacing: .08em; font-weight: 700; color: var(--teal); margin-left: .4rem; }
  .chk li.past .tag { color: var(--mute); }
  .warnlist .acc > button { color: var(--navy); }
  .urgent { background: var(--amber); border-left: 5px solid var(--amber-b); padding: .7rem .9rem; border-radius: 6px; margin-bottom: .8rem; }
  .units { display: flex; gap: .3rem; }
  .units button { border: 1px solid var(--rule); background: #fff; border-radius: 8px; padding: .3rem .7rem; cursor: pointer; font-size: .85rem; }
  .units button.on { background: var(--navy); color: #fff; border-color: var(--navy); }

  /* ---- search results ---- */
  .results ol { list-style: none; margin: 0; padding: 0; }
  .results li button { display: block; width: 100%; text-align: left; background: #fff; border: 1px solid var(--rule); border-radius: 10px; padding: .7rem .9rem; cursor: pointer; color: var(--ink); line-height: 1.35; margin-bottom: .5rem; }
  .results li button:hover { background: var(--navy-lt); }
  .results li button b { color: var(--navy); display: block; font-size: 1rem; }
  .results li button small { color: var(--teal); font-size: .72rem; letter-spacing: .08em; text-transform: uppercase; }
  .results li button .snip { font-size: .9rem; color: var(--mute); }
  /* ---- birth preferences ---- */
  .bpq { display: flex; gap: .65rem; align-items: flex-start; padding: .5rem 0; border-bottom: 1px solid var(--rule); cursor: pointer; }
  .bpq:last-child { border-bottom: 0; }
  .bpq input { width: 20px; height: 20px; margin: .15rem 0 0 0; accent-color: var(--teal); flex: 0 0 auto; }
  fieldset.bpr { border: 0; padding: 0; margin: .3rem 0 .8rem 0; }
  fieldset.bpr legend { font-weight: 700; color: var(--navy); padding: 0; margin-bottom: .2rem; }
  .bpsub { font-weight: 700; color: var(--navy); margin: .6rem 0 .1rem 0; }
  .field textarea { font: inherit; font-size: 1rem; border: 1px solid var(--rule); border-radius: 10px; padding: .5rem .7rem; background: #fff; min-height: 4.5rem; resize: vertical; }
  .bpbtns { display: flex; gap: .6rem; flex-wrap: wrap; align-items: center; margin: .4rem 0 1rem 0; }
  .bpbtns .primary { font-weight: 700; color: #fff; background: var(--navy); border: 0; border-radius: 10px; padding: .6rem 1.1rem; cursor: pointer; }
  .bpprint { display: none; }
  .bpinfo { margin: .1rem 0 .5rem 2.1rem; font-size: .92rem; }
  .bpinfo summary { cursor: pointer; color: var(--teal); font-weight: 700; font-size: .85rem; }
  .bpinfo > div { background: var(--teal-lt); border-radius: 8px; padding: .6rem .8rem; margin-top: .35rem; }
  .bpinfo p:last-child { margin-bottom: 0; }
  .bpready { display: flex; gap: .6rem; flex-wrap: wrap; align-items: center; background: var(--teal-lt); border-radius: 10px; padding: .6rem .8rem; margin: 0 0 1rem 0; }
  .bpsheet { font-size: 10pt; line-height: 1.35; color: #000; background: #fff; }
  .bpsheet.pdf { padding: 0; font-family: "Noto Sans", "Noto Sans KR", Arial, sans-serif; }
  .bpsheet .bph { display: flex; justify-content: space-between; align-items: center; gap: 1rem; border-bottom: 2px solid var(--navy); padding-bottom: .4rem; margin-bottom: .5rem; }
  .bpsheet .bph img { height: 46px; width: auto; }
  .bpsheet h1 { font-size: 16pt; }
  .bpsheet table { font-size: 9.5pt; margin: 0 0 .5rem 0; }
  .bpsheet th, .bpsheet td { padding: .15rem .4rem; }
  .bpsheet th { width: 32%; background: none; }
  .bpsheet .cols { column-count: 2; column-gap: 1.4rem; }
  .bpsheet.pdf .cols { column-count: 1; }
  .bpsheet .sec { break-inside: avoid; margin-bottom: .5rem; }
  .bpsheet h2 { font-size: 11pt; color: var(--navy); border-bottom: 1px solid var(--rule); margin: 0 0 .2rem 0; padding-bottom: .1rem; }
  .bpsheet ul { list-style: none; padding: 0; margin: 0; }
  .bpsheet li { margin: 0 0 .2rem 0; padding-left: 1rem; position: relative; break-inside: avoid; }
  .bpsheet li::before { content: "\2713"; position: absolute; left: 0; color: var(--teal); font-weight: 700; }
  .bpsheet .en { display: block; color: #555; font-size: 8.5pt; font-style: italic; }
  .bpsheet .disc { font-size: 8.5pt; color: #444; margin: .4rem 0; }
  .bpsheet .sign { display: grid; grid-template-columns: 2fr 1fr; gap: 1.5rem; margin-top: 1.2rem; font-size: 9pt; break-inside: avoid; page-break-inside: avoid; }
  .bpsheet .sign div { border-top: 1px solid #000; padding-top: .15rem; }
  @media print {
    @page { margin: 12mm; }
    html, body { background: #fff; }
    .top { display: none !important; }
    main { max-width: none; padding: 0; }
    body.bpmode main > :not(.bpprint) { display: none !important; }
    .bpprint { display: block !important; }
  }
  .loading { text-align: center; color: var(--mute); padding: 3rem 1rem; }
  .foot { font-size: .78rem; color: var(--mute); margin-top: 2rem; text-align: center; }
</style>
</head>
<body class="wch">

<header class="top"><div class="bar">
  <button class="iconbtn" id="homeBtn" aria-label="Home"><img src="icon.png" alt=""></button>
  <div class="appname" id="appName">Prenatal Packet</div>
  <div class="selrow">
    <label class="sel"><span id="lblPractice">My doctor</span><select id="doctor"></select></label>
    <label class="sel"><span id="lblLang">Language</span>
      <select id="lang">
        <option value="en">English</option>
        <option value="es">Español</option>
        <option value="ko">한국어</option>
        <option value="ht">Kreyòl Ayisyen</option>

en: {
  delay:'<p>Delayed cord clamping means waiting at least 30 to 60 seconds after birth before clamping the umbilical cord. More blood flows from the placenta to the baby.</p><p>In full-term babies, this raises iron levels in the first months of life. In preterm babies, it improves blood flow and lowers the need for blood transfusions. ACOG recommends it for most healthy newborns.</p><p>It slightly raises the chance of newborn jaundice that needs light treatment. It may not be done if your baby needs help breathing right away or if you are bleeding heavily.</p>',
  circ:'<p>Circumcision is surgery to remove the foreskin, the skin that covers the tip of the penis. It is not required.</p><p>Benefits include a lower risk of urinary tract infections in the first year, a lower risk of some sexually transmitted infections, including HIV, later in life, and a lower risk of penile cancer, which is rare. Problems are uncommon and usually minor, such as bleeding or infection. Pain medicine is used.</p><p>U.S. medical experts say the health benefits outweigh the risks, but not enough to recommend it for every baby. It is a personal, cultural, or religious choice for your family. Ask whether your insurance covers it.</p>',
  vitk:'<p><b>Why it is given.</b> Babies are born with very little vitamin K, which the body needs to stop bleeding. Breast milk has little vitamin K. Without it, some babies develop vitamin K deficiency bleeding (VKDB), which can cause bleeding in the brain or gut.</p><p><b>What the evidence shows.</b> Without vitamin K, bleeding in the first week affects about 1 in 60 to 1 in 400 newborns. Late VKDB can appear from 2 weeks to 6 months of age, often with no warning signs. About half of these babies have bleeding in the brain, which can cause lasting brain damage or death. Babies who do not get the shot are 81 times more likely to develop late VKDB than babies who do.</p><p><b>Safety.</b> It is one shot in the thigh. Side effects are minor, such as brief pain or a small bruise. Large studies have found no link between the vitamin K shot and childhood cancer. Vitamin K by mouth is not approved in the U.S., needs several doses, and does not protect as well against late bleeding.</p><p>The American Academy of Pediatrics recommends one vitamin K shot for every newborn.</p><p class="small">Sources: AAP Committee on Fetus and Newborn, Controversies Concerning Vitamin K and the Newborn; CDC, Vitamin K Deficiency Bleeding.</p>',
  eye:'<p><b>Why it is given.</b> Gonorrhea can pass to a baby\'s eyes during birth and cause a serious eye infection (ophthalmia neonatorum). It can damage the eye and cause blindness within days.</p><p><b>What the evidence shows.</b> Without prevention, about 30 to 50 out of 100 babies exposed to gonorrhea at birth develop this infection. Testing during pregnancy lowers the risk, but infections can be missed or can happen after testing, and many people have no symptoms. The U.S. Preventive Services Task Force gives eye ointment for all newborns its highest rating (Grade A). Many states require it by law.</p><p><b>Safety.</b> Erythromycin 0.5% ointment is the only eye ointment available in the U.S. for this purpose. It may cause mild eye irritation or blurry vision for a short time. It does not reliably prevent eye infections from chlamydia. Ask whether it can be given after the first hour of skin-to-skin contact.</p><p class="small">Sources: USPSTF, Ocular Prophylaxis for Gonococcal Ophthalmia Neonatorum (2019); CDC, Sexually Transmitted Infections Treatment Guidelines (2021).</p>',
  hepb:'<p><b>Why it is given.</b> Hepatitis B is a virus that damages the liver. A baby can get it at birth from a parent who has it, often without knowing, or later from someone in the home.</p><p><b>What the evidence shows.</b> About 9 in 10 babies infected at birth develop lifelong infection, and about 1 in 4 of them will die early from liver failure or liver cancer. The first dose, given within 24 hours of birth, prevents most infections passed at birth. It also protects the baby if a parent\'s test result is wrong or missing, or if the parent becomes infected after testing.</p><p><b>Safety.</b> Newborns in the U.S. have received this vaccine since 1991. Side effects are usually mild, such as soreness where the shot was given.</p><p>ACOG and the American Academy of Pediatrics recommend the first dose within 24 hours of birth for medically stable babies.</p><p class="small">Sources: AAP; ACOG; CDC, Hepatitis B and Perinatal Transmission.</p>',
  monitor:'<p>Intermittent monitoring means a nurse or provider listens to your baby\'s heartbeat at set times with a handheld device, instead of using belts on your belly the whole time. It can let you move around more freely.</p><p>It is an option for healthy patients with low-risk labor. Continuous monitoring is needed with an epidural, with medicine to start or speed up labor, with some health conditions, or if there is any concern about your baby\'s heart rate.</p>',
  skin:'<p>Your baby is placed bare on your bare chest right after birth and covered with a warm blanket. Skin-to-skin contact helps keep your baby warm, steadies your baby\'s heart rate, breathing, and blood sugar, and helps breastfeeding get started.</p><p>It can often be done after a cesarean, too. A support person can also do skin-to-skin if you are not able to.</p>',
  cordblood:'<p>Blood left in the umbilical cord and placenta after birth contains stem cells that can treat some blood diseases. Public donation is free, and the blood may help another patient. Private banking stores the blood for your family for a fee. ACOG notes that the chance a child will use their own stored cord blood is very small.</p><p>Banking must be arranged before labor. Collecting cord blood should not change or delay your care or your baby\'s care, but delayed cord clamping leaves less blood to collect.</p>',
  saline:'<p>A saline lock is a small, flexible tube placed in a vein in your hand or arm and capped off, without a bag of fluids attached. It lets you move freely while keeping a vein ready in case you need fluids or medicine quickly.</p><p>You will need IV fluids if you have an epidural, need medicine through the IV, or become dehydrated.</p>',
  room:'<p>Rooming-in means your baby stays in your room with you day and night. It helps you learn your baby\'s hunger cues, supports breastfeeding, and helps you feel ready to care for your baby at home. Nurses still check on you and your baby.</p>' },
es: {
  delay:'<p>El pinzamiento tardío del cordón significa esperar por lo menos 30 a 60 segundos después del nacimiento antes de pinzar el cordón umbilical. Así pasa más sangre de la placenta al bebé.</p><p>En bebés nacidos a término, aumenta las reservas de hierro durante los primeros meses de vida. En bebés prematuros, mejora la circulación y reduce la necesidad de transfusiones de sangre. ACOG lo recomienda para la mayoría de los recién nacidos sanos.</p><p>Aumenta un poco la probabilidad de ictericia (color amarillo de la piel) que necesite tratamiento con luz. Puede que no se haga si su bebé necesita ayuda para respirar de inmediato o si usted tiene un sangrado abundante.</p>',
  circ:'<p>La circuncisión es una cirugía para quitar el prepucio, la piel que cubre la punta del pene. No es obligatoria.</p><p>Sus beneficios incluyen un menor riesgo de infecciones urinarias en el primer año, un menor riesgo de algunas infecciones de transmisión sexual, incluido el VIH, más adelante en la vida, y un menor riesgo de cáncer de pene, que es poco común. Las complicaciones son poco frecuentes y casi siempre leves, como sangrado o infección. Se usa medicamento para el dolor.</p><p>Los expertos médicos de EE. UU. dicen que los beneficios para la salud son mayores que los riesgos, pero no lo suficiente como para recomendarla para todos los bebés. Es una decisión personal, cultural o religiosa de su familia. Pregunte si su seguro la cubre.</p>',
  vitk:'<p><b>Por qué se aplica.</b> Los bebés nacen con muy poca vitamina K, que el cuerpo necesita para detener el sangrado. La leche materna tiene poca vitamina K. Sin ella, algunos bebés presentan sangrado por deficiencia de vitamina K (SDVK), que puede causar sangrado en el cerebro o el intestino.</p><p><b>Lo que muestra la evidencia.</b> Sin vitamina K, el sangrado en la primera semana afecta a entre 1 de cada 60 y 1 de cada 400 recién nacidos. El SDVK tardío puede aparecer entre las 2 semanas y los 6 meses de edad, muchas veces sin señales de alarma. Cerca de la mitad de estos bebés tienen sangrado en el cerebro, que puede causar daño cerebral permanente o la muerte. Los bebés que no reciben la inyección tienen 81 veces más probabilidad de presentar SDVK tardío que los que sí la reciben.</p><p><b>Seguridad.</b> Es una sola inyección en el muslo. Los efectos secundarios son leves, como dolor breve o un pequeño moretón. Estudios grandes no han encontrado relación entre la inyección de vitamina K y el cáncer infantil. La vitamina K por boca no está aprobada en EE. UU., requiere varias dosis y protege menos contra el sangrado tardío.</p><p>La Academia Americana de Pediatría recomienda una inyección de vitamina K para todos los recién nacidos.</p><p class="small">Sources: AAP Committee on Fetus and Newborn, Controversies Concerning Vitamin K and the Newborn; CDC, Vitamin K Deficiency Bleeding.</p>',
  eye:'<p><b>Por qué se aplica.</b> La gonorrea puede pasar a los ojos del bebé durante el parto y causar una infección grave de los ojos (oftalmía neonatal). Puede dañar el ojo y causar ceguera en pocos días.</p><p><b>Lo que muestra la evidencia.</b> Sin prevención, entre 30 y 50 de cada 100 bebés expuestos a la gonorrea al nacer presentan esta infección. Las pruebas durante el embarazo reducen el riesgo, pero una infección puede no detectarse o adquirirse después de la prueba, y muchas personas no tienen síntomas. El Grupo de Trabajo de Servicios Preventivos de EE. UU. (USPSTF) da a la pomada para los ojos en todos los recién nacidos su calificación más alta (Grado A). Muchos estados la exigen por ley.</p><p><b>Seguridad.</b> La pomada de eritromicina al 0.5% es la única pomada para los ojos disponible en EE. UU. para este fin. Puede causar irritación leve o visión borrosa por poco tiempo. No previene de forma confiable las infecciones de los ojos por clamidia. Pregunte si se puede aplicar después de la primera hora de contacto piel con piel.</p><p class="small">Sources: USPSTF, Ocular Prophylaxis for Gonococcal Ophthalmia Neonatorum (2019); CDC, Sexually Transmitted Infections Treatment Guidelines (2021).</p>',
  hepb:'<p><b>Por qué se aplica.</b> La hepatitis B es un virus que daña el hígado. Un bebé puede contraerla al nacer de uno de los padres que la tiene, muchas veces sin saberlo, o más adelante de alguien en el hogar.</p><p><b>Lo que muestra la evidencia.</b> Cerca de 9 de cada 10 bebés infectados al nacer desarrollan una infección de por vida, y cerca de 1 de cada 4 de ellos morirá antes de tiempo por insuficiencia hepática o cáncer de hígado. La primera dosis, aplicada en las primeras 24 horas de vida, previene la mayoría de las infecciones transmitidas al nacer. También protege al bebé si el resultado de la prueba de uno de los padres es incorrecto o falta, o si se infecta después de la prueba.</p><p><b>Seguridad.</b> Los recién nacidos en EE. UU. reciben esta vacuna desde 1991. Los efectos secundarios suelen ser leves, como dolor en el lugar de la inyección.</p><p>ACOG y la Academia Americana de Pediatría recomiendan la primera dosis en las primeras 24 horas de vida para los bebés médicamente estables.</p><p class="small">Sources: AAP; ACOG; CDC, Hepatitis B and Perinatal Transmission.</p>',
  monitor:'<p>El monitoreo intermitente significa que una enfermera o su proveedor escucha los latidos de su bebé a intervalos fijos con un aparato de mano, en lugar de usar cinturones sobre el vientre todo el tiempo. Le permite moverse con más libertad.</p><p>Es una opción para pacientes sanas con un trabajo de parto de bajo riesgo. Se necesita monitoreo continuo si recibe una epidural, si recibe medicamentos para iniciar o acelerar el trabajo de parto, si tiene ciertas afecciones de salud o si hay alguna preocupación por el ritmo cardíaco de su bebé.</p>',
  skin:'<p>Se coloca a su bebé desnudo sobre su pecho desnudo justo después del nacimiento y se le cubre con una manta tibia. El contacto piel con piel ayuda a mantener caliente a su bebé, estabiliza su ritmo cardíaco, su respiración y su nivel de azúcar en la sangre, y ayuda a iniciar la lactancia.</p><p>Muchas veces también se puede hacer después de una cesárea. Si usted no puede, su persona de apoyo también puede hacerlo.</p>',
  cordblood:'<p>La sangre que queda en el cordón umbilical y la placenta después del nacimiento contiene células madre que pueden tratar algunas enfermedades de la sangre. La donación pública es gratuita y la sangre puede ayudar a otro paciente. Los bancos privados guardan la sangre para su familia a cambio de un pago. ACOG señala que la probabilidad de que un niño use su propia sangre de cordón guardada es muy baja.</p><p>Debe organizarse antes del parto. La recolección no debe cambiar ni retrasar su atención ni la de su bebé, pero el pinzamiento tardío del cordón deja menos sangre para recolectar.</p>',
  saline:'<p>Una vía intravenosa cerrada es un tubito flexible que se coloca en una vena de la mano o el brazo y se tapa, sin una bolsa de suero conectada. Le permite moverse libremente y deja una vena lista por si necesita líquidos o medicamentos con rapidez.</p><p>Necesitará suero si recibe una epidural, si necesita medicamentos por vía intravenosa o si se deshidrata.</p>',
  room:'<p>El alojamiento conjunto significa que su bebé se queda en su habitación con usted de día y de noche. Le ayuda a conocer las señales de hambre de su bebé, apoya la lactancia y le ayuda a sentirse lista para cuidar a su bebé en casa. Las enfermeras siguen revisándolos a usted y a su bebé.</p>' },
ko: {
  delay:'<p>탯줄 늦게 자르기(지연 결찰)는 출생 후 최소 30~60초를 기다렸다가 탯줄을 집는 것입니다. 태반에서 아기에게 더 많은 혈액이 전달됩니다.</p><p>만삭아의 경우 생후 몇 개월 동안 철분 저장량이 늘어납니다. 조산아의 경우 혈액 순환이 좋아지고 수혈이 필요할 가능성이 줄어듭니다. ACOG는 대부분의 건강한 신생아에게 이를 권장합니다.</p><p>광선 치료가 필요한 신생아 황달의 가능성이 약간 높아집니다. 아기가 즉시 호흡 도움이 필요하거나 산모의 출혈이 많으면 시행하지 않을 수 있습니다.</p>',
  circ:'<p>포경수술은 음경 끝을 덮고 있는 피부(포피)를 제거하는 수술입니다. 필수는 아닙니다.</p><p>장점으로는 생후 첫 1년 동안 요로 감염 위험 감소, 이후 HIV를 포함한 일부 성병 위험 감소, 드문 질환인 음경암 위험 감소가 있습니다. 합병증은 드물고 대개 출혈이나 감염처럼 경미합니다. 통증을 줄이는 약을 사용합니다.</p><p>미국 의학 전문가들은 건강상 이점이 위험보다 크지만 모든 아기에게 권장할 정도는 아니라고 말합니다. 가족의 개인적, 문화적 또는 종교적 선택입니다. 보험 적용 여부를 확인하십시오.</p>',
  vitk:'<p><b>투여 이유.</b> 아기는 출혈을 멈추는 데 필요한 비타민 K를 아주 적게 가지고 태어납니다. 모유에도 비타민 K가 적습니다. 비타민 K가 없으면 일부 아기에게 비타민 K 결핍성 출혈(VKDB)이 생겨 뇌나 장에 출혈이 생길 수 있습니다.</p><p><b>근거.</b> 비타민 K를 투여하지 않으면 생후 첫 주에 신생아 60명 중 1명에서 400명 중 1명꼴로 출혈이 생깁니다. 후기 VKDB는 생후 2주에서 6개월 사이에 경고 증상 없이 나타나는 경우가 많습니다. 이 아기들의 약 절반은 뇌출혈이 생기며, 이는 영구적인 뇌 손상이나 사망으로 이어질 수 있습니다. 주사를 맞지 않은 아기는 맞은 아기보다 후기 VKDB가 생길 가능성이 81배 높습니다.</p><p><b>안전성.</b> 허벅지에 주사 한 번을 맞습니다. 부작용은 잠깐의 통증이나 작은 멍 정도로 경미합니다. 대규모 연구에서 비타민 K 주사와 소아암 사이의 관련성은 발견되지 않았습니다. 먹는 비타민 K는 미국에서 승인되지 않았고, 여러 번 먹여야 하며, 후기 출혈을 막는 효과도 낮습니다.</p><p>미국소아과학회는 모든 신생아에게 비타민 K 주사 한 번을 권장합니다.</p><p class="small">Sources: AAP Committee on Fetus and Newborn, Controversies Concerning Vitamin K and the Newborn; CDC, Vitamin K Deficiency Bleeding.</p>',
  eye:'<p><b>투여 이유.</b> 임질은 출산 중 아기의 눈으로 옮아 심각한 눈 감염(신생아 안염)을 일으킬 수 있습니다. 며칠 안에 눈을 손상시키고 실명을 일으킬 수 있습니다.</p><p><b>근거.</b> 예방하지 않으면 출생 시 임질에 노출된 아기 100명 중 약 30~50명에게 이 감염이 생깁니다. 임신 중 검사로 위험이 줄어들지만, 감염을 놓치거나 검사 후에 감염될 수 있고, 증상이 없는 사람도 많습니다. 미국 예방서비스 태스크포스(USPSTF)는 모든 신생아에게 안연고를 바르는 것에 최고 등급(A등급)을 주었습니다. 많은 주에서 법으로 의무화하고 있습니다.</p><p><b>안전성.</b> 0.5% 에리스로마이신 연고는 미국에서 이 목적으로 사용할 수 있는 유일한 안연고입니다. 잠시 가벼운 눈 자극이나 흐린 시야가 생길 수 있습니다. 클라미디아로 인한 눈 감염은 확실하게 예방하지 못합니다. 첫 1시간 피부 맞대기 후에 발라도 되는지 물어보십시오.</p><p class="small">Sources: USPSTF, Ocular Prophylaxis for Gonococcal Ophthalmia Neonatorum (2019); CDC, Sexually Transmitted Infections Treatment Guidelines (2021).</p>',
  hepb:'<p><b>투여 이유.</b> B형 간염은 간을 손상시키는 바이러스입니다. 아기는 출생 시 감염된 부모에게서(부모가 모르는 경우도 많음), 또는 이후 집에 있는 다른 사람에게서 감염될 수 있습니다.</p><p><b>근거.</b> 출생 시 감염된 아기 10명 중 약 9명은 평생 감염 상태가 되며, 그중 약 4명 중 1명은 간부전이나 간암으로 일찍 사망합니다. 출생 후 24시간 이내에 맞는 첫 접종은 출생 시 전파되는 감염 대부분을 예방합니다. 부모의 검사 결과가 틀렸거나 없는 경우, 또는 검사 후 부모가 감염된 경우에도 아기를 보호합니다.</p><p><b>안전성.</b> 미국 신생아는 1991년부터 이 백신을 맞아 왔습니다. 부작용은 주사 부위 통증처럼 대개 경미합니다.</p><p>ACOG와 미국소아과학회는 건강 상태가 안정된 아기에게 출생 후 24시간 이내 첫 접종을 권장합니다.</p><p class="small">Sources: AAP; ACOG; CDC, Hepatitis B and Perinatal Transmission.</p>',
  monitor:'<p>간헐적 태아 감시는 배에 벨트를 계속 두르는 대신 간호사나 의료진이 정해진 시간마다 휴대용 기기로 아기의 심장 박동을 듣는 방법입니다. 더 자유롭게 움직일 수 있습니다.</p><p>위험도가 낮은 진통 중인 건강한 산모가 선택할 수 있습니다. 경막외 마취를 받거나, 진통을 유도하거나 촉진하는 약을 쓰거나, 특정 건강 문제가 있거나, 아기의 심박수에 우려가 있으면 지속적 감시가 필요합니다.</p>',
  skin:'<p>출생 직후 아기를 맨몸으로 산모의 맨가슴 위에 올리고 따뜻한 담요로 덮습니다. 피부 맞대기는 아기의 체온을 유지하고 심박수, 호흡, 혈당을 안정시키며 모유 수유 시작을 돕습니다.</p><p>제왕절개 후에도 할 수 있는 경우가 많습니다. 산모가 할 수 없으면 보호자가 대신할 수도 있습니다.</p>',
  cordblood:'<p>출생 후 탯줄과 태반에 남은 혈액(제대혈)에는 일부 혈액 질환을 치료할 수 있는 줄기세포가 들어 있습니다. 공공 기증은 무료이며 다른 환자에게 도움이 될 수 있습니다. 개인 제대혈 은행은 비용을 받고 가족을 위해 보관합니다. ACOG는 아이가 자신의 보관된 제대혈을 사용할 가능성은 매우 낮다고 설명합니다.</p><p>진통 전에 미리 신청해야 합니다. 채취 때문에 산모나 아기의 진료가 바뀌거나 늦어져서는 안 되지만, 탯줄을 늦게 자르면 채취할 수 있는 혈액이 줄어듭니다.</p>',
  saline:'<p>정맥 라인만 확보하는 것은 손이나 팔의 정맥에 작고 유연한 관을 넣고 수액 주머니를 연결하지 않은 채 막아 두는 것입니다. 자유롭게 움직일 수 있으면서도 수액이나 약이 급히 필요할 때 바로 쓸 수 있습니다.</p><p>경막외 마취를 받거나, 정맥으로 약을 맞아야 하거나, 탈수가 되면 수액이 필요합니다.</p>',
  room:'<p>모자동실은 아기가 밤낮으로 산모와 같은 방에 머무는 것입니다. 아기의 배고픔 신호를 익히고, 모유 수유를 돕고, 집에서 아기를 돌볼 준비가 되었다고 느끼는 데 도움이 됩니다. 간호사가 계속 산모와 아기를 확인합니다.</p>' },
ht: {
  delay:'<p>Tann anvan yo kranpe kòd la vle di yo tann omwen 30 a 60 segonn apre tibebe a fèt anvan yo kranpe kòd lonbrit la. Konsa, plis san pase soti nan plasenta a al jwenn tibebe a.</p><p>Pou tibebe ki fèt a tèm, sa ogmante rezèv fè yo pandan premye mwa lavi yo. Pou tibebe ki fèt anvan lè, sa amelyore sikilasyon san an epi diminye bezwen pou transfizyon san. ACOG rekòmande l pou pifò tibebe ki fèk fèt an sante.</p><p>Li ogmante yon ti kras chans pou jonis (po jòn) ki bezwen tretman ak limyè. Yo ka pa fè l si tibebe a bezwen èd pou respire touswit oswa si ou ap senyen anpil.</p>',
  circ:'<p>Sikonsizyon se yon operasyon pou retire prepis la, po ki kouvri pwent pati gason an. Li pa obligatwa.</p><p>Avantaj yo gen ladan yo: mwens risk enfeksyon nan pipi pandan premye ane a, mwens risk pou kèk enfeksyon seksyèlman transmisib, tankou VIH, pita nan lavi, ak mwens risk kansè penis, ki ra. Pwoblèm yo pa frekan e yo souvan piti, tankou senyen oswa enfeksyon. Yo bay medikaman pou doulè.</p><p>Ekspè medikal Ozetazini di avantaj pou sante yo pi gran pase risk yo, men se pa ase pou rekòmande l pou tout tibebe. Se yon chwa pèsonèl, kiltirèl, oswa relijye pou fanmi ou. Mande si asirans ou kouvri l.</p>',
  vitk:'<p><b>Poukisa yo bay li.</b> Tibebe yo fèt ak trè piti vitamin K, kò a bezwen l pou sispann senyen. Lèt manman gen ti kras vitamin K. San li, kèk tibebe fè senyen akoz mank vitamin K (VKDB), ki ka lakoz senyen nan sèvo oswa nan trip.</p><p><b>Sa prèv yo montre.</b> San vitamin K, senyen nan premye semèn nan rive nan anviwon 1 sou 60 a 1 sou 400 tibebe ki fèk fèt. VKDB ki vin pita a ka parèt ant 2 semèn ak 6 mwa, souvan san okenn siy avètisman. Anviwon mwatye nan tibebe sa yo senyen nan sèvo, sa ka lakoz domaj nan sèvo ki pa geri oswa lanmò. Tibebe ki pa pran piki a gen 81 fwa plis chans pou fè VKDB ki vin pita pase tibebe ki pran l.</p><p><b>Sekirite.</b> Se yon sèl piki nan kwis la. Efè segondè yo piti, tankou yon doulè ki pa dire oswa yon ti mak. Gwo etid pa jwenn okenn lyen ant piki vitamin K ak kansè nan timoun. Vitamin K nan bouch pa apwouve Ozetazini, li bezwen plizyè dòz, e li pa pwoteje osi byen kont senyen ki vin pita.</p><p>Akademi Ameriken Pedyatri rekòmande yon piki vitamin K pou chak tibebe ki fèk fèt.</p><p class="small">Sources: AAP Committee on Fetus and Newborn, Controversies Concerning Vitamin K and the Newborn; CDC, Vitamin K Deficiency Bleeding.</p>',
  eye:'<p><b>Poukisa yo bay li.</b> Gonore ka pase nan je tibebe a pandan akouchman an epi lakoz yon enfeksyon grav nan je (oftalmi neonatal). Li ka domaje je a epi lakoz avèg nan kèk jou.</p><p><b>Sa prèv yo montre.</b> San prevansyon, anviwon 30 a 50 sou 100 tibebe ki ekspoze a gonore lè yo fèt fè enfeksyon sa a. Tès pandan gwosès la diminye risk la, men yo ka rate yon enfeksyon oswa moun nan ka enfekte apre tès la, e anpil moun pa gen sentòm. Gwoup Travay Sèvis Prevantif Ozetazini (USPSTF) bay pomad pou je pou tout tibebe ki fèk fèt nòt ki pi wo a (Grad A). Anpil eta egzije l pa lalwa.</p><p><b>Sekirite.</b> Pomad eritwomisin 0.5% se sèl pomad pou je ki disponib Ozetazini pou sa. Li ka lakoz yon ti iritasyon nan je oswa fè je a wè twoub pou yon ti tan. Li pa anpeche enfeksyon nan je akoz klamidya yon fason ki fyab. Mande si yo ka mete l apre premye èdtan kontak po ak po a.</p><p class="small">Sources: USPSTF, Ocular Prophylaxis for Gonococcal Ophthalmia Neonatorum (2019); CDC, Sexually Transmitted Infections Treatment Guidelines (2021).</p>',
  hepb:'<p><b>Poukisa yo bay li.</b> Epatit B se yon viris ki domaje fwa a. Yon tibebe ka pran l lè l fèt nan men yon paran ki genyen l, souvan san paran an pa konnen, oswa pita nan men yon moun lakay la.</p><p><b>Sa prèv yo montre.</b> Anviwon 9 sou 10 tibebe ki enfekte lè yo fèt gen enfeksyon an pou tout lavi yo, e anviwon 1 sou 4 nan yo ap mouri twò bonè akoz fwa ki sispann travay oswa kansè fwa. Premye dòz la, yo bay nan 24 èdtan apre nesans, anpeche pifò enfeksyon ki pase lè tibebe a fèt. Li pwoteje tibebe a tou si rezilta tès yon paran pa bon oswa li manke, oswa si paran an vin enfekte apre tès la.</p><p><b>Sekirite.</b> Tibebe ki fèk fèt Ozetazini ap pran vaksen sa a depi 1991. Efè segondè yo souvan piti, tankou doulè kote yo bay piki a.</p><p>ACOG ak Akademi Ameriken Pedyatri rekòmande premye dòz la nan 24 èdtan apre nesans pou tibebe ki estab medikalman.</p><p class="small">Sources: AAP; ACOG; CDC, Hepatitis B and Perinatal Transmission.</p>',
  monitor:'<p>Siveyans de tanzantan vle di yon enfimyè oswa founisè koute batman kè tibebe a nan lè fiks ak yon ti aparèy nan men, olye yo mete senti sou vant ou tout tan. Sa ka pèmèt ou deplase pi libman.</p><p>Se yon opsyon pou pasyan ki an sante ki gen yon tranche ki pa gen anpil risk. Yo bezwen siveyans kontinyèl si ou pran yon epidiral, si ou pran medikaman pou kòmanse oswa akselere tranche a, si ou gen sèten pwoblèm sante, oswa si gen nenpòt enkyetid sou batman kè tibebe a.</p>',
  skin:'<p>Yo mete tibebe a toutouni sou pwatrin ou ki toutouni touswit apre li fèt, epi yo kouvri l ak yon lenn cho. Kontak po ak po ede kenbe tibebe a cho, estabilize batman kè l, respirasyon l, ak sik nan san l, epi li ede bay tete kòmanse.</p><p>Souvan yo ka fè l apre yon sezaryèn tou. Si ou pa ka fè l, moun k ap sipòte w la ka fè l tou.</p>',
  cordblood:'<p>San ki rete nan kòd lonbrit la ak plasenta a apre nesans gen selil souch ki ka trete kèk maladi san. Don piblik la gratis, e san an ka ede yon lòt pasyan. Bank prive yo konsève san an pou fanmi ou pou yon frè. ACOG di chans pou yon timoun sèvi ak pwòp san kòd li ki konsève a piti anpil.</p><p>Fòk ou ranje sa anvan tranche. Ranmase san an pa dwe chanje ni retade swen ou oswa swen tibebe a, men lè yo tann pou kranpe kòd la, gen mwens san pou ranmase.</p>',
  saline:'<p>Yon kateter nan venn san sewòm se yon ti tib fleksib yo mete nan yon venn nan men oswa nan bra ou epi yo bouche l, san sak sewòm konekte. Li pèmèt ou deplase libman pandan yon venn rete pare si ou bezwen likid oswa medikaman rapid.</p><p>Ou ap bezwen sewòm si ou pran yon epidiral, si ou bezwen medikaman nan venn, oswa si ou dezidrate.</p>',
  room:'<p>Kenbe tibebe a nan chanm ou vle di tibebe a rete nan chanm nan avè w lajounen kou lannwit. Sa ede w aprann siy grangou tibebe a, li sipòte bay tete, epi li ede w santi w pare pou okipe tibebe a lakay. Enfimyè yo toujou ap tcheke ou menm ak tibebe a.</p>' }
};

/* ---------- state ---------- */
const $ = id => document.getElementById(id);
let lang = 'en', doctor = '', practice = 'wch', content = null, screen = 'home';
try { doctor = localStorage.getItem('hn_doctor') || ''; lang = localStorage.getItem('hn_lang') || lang; } catch(e) {}
if (!STR[lang]) lang = 'en';
const docById = id => DOCTORS.find(d => d.last + '|' + d.first === id);
if (!docById(doctor)) doctor = '';
practice = doctor ? docById(doctor).p : 'wch';
$('lang').value = lang;

function esc(t) { return String(t).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
function telLink(p) { return `<a href="tel:${p.replace(/[^0-9]/g,'')}">${p}</a>`; }
function nameLine(n, s) { const [name, g] = n; return g ? `${s.dr[g]} ${name}` : name; }

function buildDoctorSelect() {
  const s = STR[lang], sel = $('doctor'); sel.innerHTML = '';
  const o0 = document.createElement('option'); o0.value = ''; o0.textContent = s.choose; sel.appendChild(o0);
  for (const d of DOCTORS) { const o = document.createElement('option'); o.value = d.last + '|' + d.first; o.textContent = `${d.last}, ${d.first}, ${d.cred}`; sel.appendChild(o); }
  sel.value = doctor;
}

/* ---------- screens ---------- */
function coverHTML() {
  const s = STR[lang], p = PRACTICES[practice];
  const groups = p.groups.map(g => `<div><b>${s.groups[g.k]}</b>${g.names.map(n => memberHTML(n, s)).join('')}</div>`).join('');
  let offices = '';
  if (p.offices.length) offices = `<h3>${s.officesHeading}</h3><div class="offices">` + p.offices.map(o => `<div class="office"><b>${o.city}</b><br>${o.addr}<br><b>${telLink(o.phone)}</b>${o.docs.length ? '<br><span class="docs">' + o.docs.map(n => nameLine(n, s)).join(', ') + '</span>' : ''}</div>`).join('') + '</div>';
  return `<div class="card">
    <img class="cover-logo" src="${p.logo}" alt="${p.org}">
    <h1>${s.h1}</h1>
    <p class="big" style="margin-top:.6rem">${s.p1}</p>
    <p>${s.p2}</p><p>${s.p3}</p><p>${s.team[practice]}</p><p>${s.p5}</p>
    <h3>${s.teamHeading}</h3><div class="team">${groups}</div>${offices}
    <p>${s.p6}</p>
    <div class="callout navy"><p style="margin-bottom:.2rem">${s.after[p.afterhours]}</p><div class="phone">${telLink(p.phone)}</div></div>
    <p>${s.thanks}</p>
    <p style="font-family:'Noto Serif',Georgia,serif;color:var(--navy);font-style:italic">${s.sig}${p.org}</p>
  </div>`;
}

function tile(id, title, sub, icon, cls) {
  return `<button class="tile ${cls||''}" data-go="${id}"><span class="ic">${ICON[icon] || ''}</span><b>${esc(title)}</b><small>${esc(sub)}</small></button>`;
}

function homeHTML() {
  const u = UI[lang], s = STR[lang], p = PRACTICES[practice];
  const d = doctor ? docById(doctor) : null;
  const who = d ? `${d.last}, ${d.first}, ${d.cred} · ${PRACTICE_NAMES[practice]}` : PRACTICE_NAMES[practice];
  const hero = doctor ? `<div class="card hero">
      <div><img src="${p.logo}" alt="${p.org}">${photoFor(`${d.first} ${d.last}`) ? `<div class="docrow"><img src="${photoFor(`${d.first} ${d.last}`)}" alt="${esc(d.first + ' ' + d.last)}"><p class="who">${esc(who)}</p></div>` : `<p class="who">${esc(who)}</p>`}<div class="small" style="margin-top:.3rem">${s.after[p.afterhours]}</div></div>
      <div class="herorow"><a class="callbtn" href="tel:${p.phone.replace(/[^0-9]/g,'')}"><span>${u.call}</span><b>${p.phone}</b></a></div>
    </div>` : `<div class="card hero">
      <div><img src="img/logo_hn.png" alt="Holy Name"><p style="margin-top:.6rem">${u.choosePrompt}</p></div>
      <div class="herorow"><button class="linkbtn" data-focus="doctor">${u.chooseBtn}</button></div>
    </div>`;
  return hero + `
    <div class="sectitle">${u.tools}</div>
    <div class="tiles">${tile('week', u.toolTiles.week[0], u.toolTiles.week[1], 'week', 'tool')}${tile('warn', u.toolTiles.warn[0], u.toolTiles.warn[1], 'warn', 'tool')}${tile('weight', u.toolTiles.weight[0], u.toolTiles.weight[1], 'weight', 'tool')}${tile('bp', BP[lang].title, BP[lang].sub, 'bp', 'tool')}</div>
    <div class="sectitle">${u.topicsHead}</div>
    <div class="tiles">${tile('team', u.team, u.teamSub, 'team')}${TOPIC_ORDER.map(t => tile('t-' + t, u.topics[t][0], u.topics[t][1], t) + (t === 's8' ? tile('peds', u.pediatrics, u.pedsSub, 'peds') : '')).join('')}</div>
    <p class="foot">Holy Name Medical Center${doctor ? ' · ' + esc(PRACTICE_NAMES[practice]) : ''}</p>`;
}

function wrapUrls(h) { return h.replace(/(^|[>\s])((?:www\.)?holyname\.org\/[^\s<"]*)/g, (m, pre, url) => pre + url.replace(/\//g, '/<wbr>')); }
function accordion(item, idx, open) {
  return `<div class="acc${open ? ' open' : ''}" data-i="${idx}"><button type="button" aria-expanded="${open ? 'true' : 'false'}">${item.t}</button><div class="ac">${wrapUrls(item.h)}</div></div>`;
}

function topicHTML(t) {
  const u = UI[lang], pages = content.topics[t] || [];
  let h = `<button class="back" data-go="home">${u.home}</button><div class="topic"><h1>${esc(u.topics[t][0])}</h1>`;
  h += `<div class="rowbtns"><button type="button" data-acc="open">${u.expandAll}</button><button type="button" data-acc="close">${u.collapseAll}</button></div>`;
  let n = 0, srcs = [];
  if (t === 's7') {
    const tour = ((content.topics.s8 || []).flatMap(pg => pg.items).map(it => (it.h.match(/<a class="qrrow link"[^>]*>(?:(?!<\/a>)[\s\S])*?201-833-3153[\s\S]*?<\/a>/) || [])[0]).find(Boolean)) || '';
    h += `<div class="grid2" style="margin-bottom:1rem"><a class="qrrow link" href="#bp" data-go="bp" style="margin-top:0"><div class="big"><b style="color:var(--navy)">${esc(BP[lang].title)}</b><br>${esc(BP[lang].sub)}</div><span aria-hidden="true" class="arrow">&rarr;</span></a>${wrapUrls(tour).replace('class="qrrow link"', 'class="qrrow link" style="margin-top:0"')}</div>`;
  }
  pages.forEach((pg, pi) => {

async function bpPdf(btn) {
  const b = BP[lang], label = btn.textContent; let host;
  btn.disabled = true; btn.textContent = b.making;
  document.querySelectorAll('.bpready').forEach(r => { r.hidden = true; r.innerHTML = ''; });

    if (document.fonts && document.fonts.ready) await document.fonts.ready;
    host = document.createElement('div'); host.className = 'bpsheet pdf';

    await Promise.all([...host.querySelectorAll('img')].map(i => i.complete ? 0 : new Promise(r => { i.onload = i.onerror = r; })));

      const sh = Math.ceil((end - y) * k), pc = document.createElement('canvas'); pc.width = canvas.width; pc.height = sh;
      const ctx = pc.getContext('2d'); ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, pc.width, sh);

      if (!first) pdf.addPage(); first = false;

      r.innerHTML = `<b>${b.ready}</b><a class="linkbtn" href="${url}" download="${name}" target="_blank" rel="noopener">${b.open}</a>` + (canShare ? `<button type="button" class="linkbtn" data-bpact="share">${b.share}</button>` : '');

  } catch (e) { alert(b.pdfFail); }
  finally { if (host) host.remove(); btn.disabled = false; btn.textContent = label; }
}

function highlight(root, terms) {
  const re = new RegExp('(' + terms.map(t => t.replace(/[.*+?^${}()|[\]\\]/g, '\\$&')).join('|') + ')', 'gi');
  const walker = document.createTreeWalker(root, NodeFilter.SHOW_TEXT, { acceptNode: n => re.test(n.nodeValue) ? NodeFilter.FILTER_ACCEPT : NodeFilter.FILTER_REJECT });
  const nodes = []; while (walker.nextNode()) nodes.push(walker.currentNode);
  nodes.forEach(n => { const frag = document.createDocumentFragment(); n.nodeValue.split(re).forEach((part, i) => { if (i % 2) { const m = document.createElement('mark'); m.textContent = part; frag.appendChild(m); } else if (part) frag.appendChild(document.createTextNode(part)); }); n.parentNode.replaceChild(frag, n); });
}

});
$('homeBtn').addEventListener('click', () => show('home'));
$('appName').addEventListener('click', () => show('home'));
$('searchForm').addEventListener('submit', e => { e.preventDefault(); show('search', {q: $('q').value}); });
$('doctor').addEventListener('change', e => { doctor = e.target.value; practice = doctor ? docById(doctor).p : 'wch'; try { localStorage.setItem('hn_doctor', doctor); } catch(err) {} show('home'); });
$('lang').addEventListener('change', e => { lang = e.target.value; try { localStorage.setItem('hn_lang', lang); } catch(err) {} loadLang(); });
window.addEventListener('hashchange', () => { const id = location.hash.slice(1); if (id && id !== screen) show(id, {silent:true}); });

async function loadLang() {
  const s = STR[lang], u = UI[lang];
  document.documentElement.lang = lang;
  $('appName').textContent = s.app; $('lblPractice').textContent = s.practice; $('lblLang').textContent = s.language;
  $('q').placeholder = s.searchPh; $('searchBtn').textContent = s.search; $('homeBtn').setAttribute('aria-label', u.home);
  document.title = 'Holy Name ' + s.app; buildDoctorSelect();
  $('main').innerHTML = `<div class="loading">${s.loading}</div>`;
  try { const r = await fetch(`content/${lang}.json`, {cache:'no-cache'}); if (!r.ok) throw new Error(r.status); content = await r.json(); }
  catch (e) { content = {topics:{}}; }
  const id = location.hash.slice(1) || 'home';
  show(id === 'search' ? 'home' : id, {silent:true});
}
loadLang();

</script>
</body>
