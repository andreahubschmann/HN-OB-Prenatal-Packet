/* ---------- state ---------- */
const $ = id => document.getElementById(id);
let lang = 'en', doctor = '', practice = 'wch', content = null, screen = 'home';
try { doctor = localStorage.getItem('hn_doctor') || ''; lang = localStorage.getItem('hn_lang') || lang; } catch(e) {}
if (!STR[lang]) lang = 'en';
const docById = id => DOCTORS.find(d => d.last + '|' + d.first === id);
if (!docById(doctor)) doctor = '';
practice = doctor ? docById(doctor).p : 'wch';
$('lang').value = lang;

function esc(t) { return String(t).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
function telLink(p) { return `<a href="tel:${p.replace(/[^0-9]/g,'')}">${p}</a>`; }
function nameLine(n, s) { const [name, g] = n; return g ? `${s.dr[g]} ${name}` : name; }

function buildDoctorSelect() {
  const s = STR[lang], sel = $('doctor'); sel.innerHTML = '';
  const o0 = document.createElement('option'); o0.value = ''; o0.textContent = s.choose; sel.appendChild(o0);
  for (const d of DOCTORS) { const o = document.createElement('option'); o.value = d.last + '|' + d.first; o.textContent = `${d.last}, ${d.first}, ${d.cred}`; sel.appendChild(o); }
  sel.value = doctor;
}

/* ---------- screens ---------- */
function coverHTML() {
  const s = STR[lang], p = PRACTICES[practice];
  const groups = p.groups.map(g => `<div><b>${s.groups[g.k]}</b>${g.names.map(n => nameLine(n, s)).join('<br>')}</div>`).join('');
  let offices = '';
  if (p.offices.length) offices = `<h3>${s.officesHeading}</h3><div class="offices">` + p.offices.map(o => `<div class="office"><b>${o.city}</b><br>${o.addr}<br><b>${telLink(o.phone)}</b>${o.docs.length ? '<br><span class="docs">' + o.docs.map(n => nameLine(n, s)).join(', ') + '</span>' : ''}</div>`).join('') + '</div>';
  return `<div class="card">
    <img class="cover-logo" src="${p.logo}" alt="${p.org}">
    <h1>${s.h1}</h1>
    <p class="big" style="margin-top:.6rem">${s.p1}</p>
    <p>${s.p2}</p><p>${s.p3}</p><p>${s.team[practice]}</p><p>${s.p5}</p>
    <h3>${s.teamHeading}</h3><div class="team">${groups}</div>${offices}
    <p>${s.p6}</p>
    <div class="callout navy"><p style="margin-bottom:.2rem">${s.after[p.afterhours]}</p><div class="phone">${telLink(p.phone)}</div></div>
    <p>${s.thanks}</p>
    <p style="font-family:'Noto Serif',Georgia,serif;color:var(--navy);font-style:italic">${s.sig}${p.org}</p>
  </div>`;
}

function tile(id, title, sub, icon, cls) {
  return `<button class="tile ${cls||''}" data-go="${id}"><span class="ic">${ICON[icon] || ''}</span><b>${esc(title)}</b><small>${esc(sub)}</small></button>`;
}

function homeHTML() {
  const u = UI[lang], s = STR[lang], p = PRACTICES[practice];
  const d = doctor ? docById(doctor) : null;
  const who = d ? `${d.last}, ${d.first}, ${d.cred} · ${PRACTICE_NAMES[practice]}` : PRACTICE_NAMES[practice];
  const hero = doctor ? `<div class="card hero">
      <div><img src="${p.logo}" alt="${p.org}"><p class="who">${esc(who)}</p><div class="small" style="margin-top:.3rem">${s.after[p.afterhours]}</div></div>
      <div class="herorow"><a class="callbtn" href="tel:${p.phone.replace(/[^0-9]/g,'')}"><span>${u.call}</span><b>${p.phone}</b></a></div>
    </div>` : `<div class="card hero">
      <div><img src="img/logo_hn.png" alt="Holy Name"><p style="margin-top:.6rem">${u.choosePrompt}</p></div>
      <div class="herorow"><button class="linkbtn" data-focus="doctor">${u.chooseBtn}</button></div>
    </div>`;
  return hero + `
    <div class="sectitle">${u.tools}</div>
    <div class="tiles">${tile('week', u.toolTiles.week[0], u.toolTiles.week[1], 'week', 'tool')}${tile('warn', u.toolTiles.warn[0], u.toolTiles.warn[1], 'warn', 'tool')}${tile('weight', u.toolTiles.weight[0], u.toolTiles.weight[1], 'weight', 'tool')}</div>
    <div class="sectitle">${u.topicsHead}</div>
    <div class="tiles">${tile('team', u.team, u.teamSub, 'team')}${TOPIC_ORDER.map(t => tile('t-' + t, u.topics[t][0], u.topics[t][1], t)).join('')}</div>
    <p class="foot">Holy Name Medical Center${doctor ? ' · ' + esc(PRACTICE_NAMES[practice]) : ''}</p>`;
}

function accordion(item, idx, open) {
  return `<div class="acc${open ? ' open' : ''}" data-i="${idx}"><button type="button" aria-expanded="${open ? 'true' : 'false'}">${item.t}</button><div class="ac">${item.h}</div></div>`;
}

function topicHTML(t) {
  const u = UI[lang], pages = content.topics[t] || [];
  let h = `<button class="back" data-go="home">${u.home}</button><div class="topic"><h1>${esc(u.topics[t][0])}</h1>`;
  h += `<div class="rowbtns"><button type="button" data-acc="open">${u.expandAll}</button><button type="button" data-acc="close">${u.collapseAll}</button></div>`;
  let n = 0, srcs = [];
  pages.forEach((pg, pi) => {
    if (pages.length > 1 && pg.title !== (pages[pi-1] || {}).title && pg.title !== u.topics[t][0] && !(pg.items.length === 1 && pg.items[0].t === pg.title)) h += `<div class="pagehead">${esc(pg.title)}</div>`;
    if (pg.intro) h += `<div class="intro">${pg.intro}</div>`;
    pg.items.forEach(it => { h += accordion(it, n++, t === 'refs' || t === 'portal'); });
    if (pg.src) srcs.push(pg.src);
  });
  if (srcs.length) h += `<details class="srcbox"><summary>${u.sources}</summary>${srcs.map(x => `<div class="src">${x}</div>`).join('')}</details>`;
  return h + '</div>';
}

function weekHTML() {
  const u = UI[lang].week, uu = UI[lang];
  let due = ''; try { due = localStorage.getItem('hn_due') || ''; } catch(e) {}
  return `<button class="back" data-go="home">${uu.home}</button><h1>${esc(uu.toolTiles.week[0])}</h1>
    <div class="card"><div class="field"><label for="due">${u.due}</label><input type="date" id="due" value="${esc(due)}"></div><div id="weekOut"></div><p class="note">${u.note}</p></div>`;
}
function renderWeek() {
  const u = UI[lang].week, out = $('weekOut'), v = $('due').value;
  try { localStorage.setItem('hn_due', v); } catch(e) {}
  if (!v) { out.innerHTML = `<p class="small">${u.notset}</p>`; return; }
  const due = new Date(v + 'T00:00:00'), today = new Date(); today.setHours(0,0,0,0);
  const daysLeft = Math.round((due - today) / 86400000); const ga = 280 - daysLeft; const w = Math.floor(ga / 7), d = ga - w * 7;
  if (ga < 0) { out.innerHTML = `<p class="small">${u.notset}</p>`; return; }
  const tri = w < 14 ? 0 : w < 28 ? 1 : w < 41 ? 2 : 3;
  const visits = w < 28 ? u.v1 : w < 36 ? u.v2 : u.v3;
  let h = `<div class="stat"><div><span>${u.today}</span><b>${w} ${u.weeks}, ${d} ${u.days}</b></div><div><span>${u.visits}</span><b style="font-size:1rem">${u.trimester[tri]}</b><div class="small">${visits}</div></div></div>`;
  h += `<h3>${u.checklist}</h3><ul class="chk">`;
  const rows = WINDOWS.map(([k, a, b, t]) => {
    let st = 'soon', lab = '';
    if (a === null) { st = 'any'; lab = u.any; }
    else if (w >= a && (b === null || w <= b)) { st = 'now'; lab = u.now; }
    else if (w > b) { st = 'past'; lab = u.past; }
    else { lab = u.soon; }
    const win = a === null ? '' : (a === b ? `${a} ${u.weeks}` : (b === null ? `${a}+ ${u.weeks}` : `${a}–${b} ${u.weeks}`));
    return {k, st, lab, win, t, order: st === 'now' ? 0 : st === 'soon' ? 1 : st === 'any' ? 2 : 3, a: a === null ? 99 : a};
  }).sort((x, y) => x.order - y.order || x.a - y.a);
  rows.forEach(r => { h += `<li class="${r.st}"><span class="dot"></span><div>${u.items[r.k]}<span class="tag">${r.lab}</span><span class="w">${r.win}</span></div></li>`; });
  h += `</ul><p style="margin-top:.8rem"><button class="linkbtn" data-go="t-s2">${u.open} &rarr;</button></p>`;
  out.innerHTML = h;
}

let wUnits = 'us';
function weightHTML() {
  const u = UI[lang].weight, uu = UI[lang];
  return `<button class="back" data-go="home">${uu.home}</button><h1>${esc(uu.toolTiles.weight[0])}</h1>
    <div class="card"><div class="units" style="margin-bottom:.8rem"><button type="button" data-u="us" class="${wUnits==='us'?'on':''}">${u.ftin} · ${u.lb}</button><button type="button" data-u="metric" class="${wUnits==='metric'?'on':''}">${u.cm} · ${u.kg}</button></div>
    <div class="field"><label>${u.height}</label>${wUnits === 'us' ? `<div class="pair"><input type="number" id="hft" min="3" max="7" placeholder="ft"><input type="number" id="hin" min="0" max="11" placeholder="in"></div>` : `<input type="number" id="hcm" min="100" max="220" placeholder="cm">`}</div>
    <div class="field"><label>${u.weight}</label><input type="number" id="wt" min="50" max="600" placeholder="${wUnits === 'us' ? u.lb : u.kg}"></div>
    <div id="wOut"><p class="small">${u.enter}</p></div><p class="note">${u.note}</p></div>`;
}
function renderWeight() {
  const u = UI[lang].weight, out = $('wOut'); let hm, kg;
  if (wUnits === 'us') { const ft = +($('hft').value || 0), inch = +($('hin').value || 0); hm = (ft * 12 + inch) * 0.0254; kg = +($('wt').value || 0) * 0.4536; }
  else { hm = +($('hcm').value || 0) / 100; kg = +($('wt').value || 0); }
  if (!(hm > 0.9) || !(kg > 20)) { out.innerHTML = `<p class="small">${u.enter}</p>`; return; }
  const bmi = kg / (hm * hm); const ci = bmi < 18.5 ? 0 : bmi < 25 ? 1 : bmi < 30 ? 2 : 3;
  const lb = [[28,40],[25,35],[15,25],[11,20]][ci]; const kgr = lb.map(x => Math.round(x * 0.4536));
  out.innerHTML = `<div class="stat"><div><span>${u.bmi}</span><b>${bmi.toFixed(1)}</b><div class="small">${u.cats[ci]}</div></div><div><span>${u.gain}</span><b>${lb[0]}–${lb[1]} ${u.lb}</b><div class="small">${kgr[0]}–${kgr[1]} ${u.kg}</div></div></div>`;
}

function warnHTML() {
  const u = UI[lang], p = PRACTICES[practice];
  let h = `<button class="back" data-go="home">${u.home}</button><h1>${esc(u.toolTiles.warn[0])}</h1><div class="urgent">${u.warn.intro}</div>
    <div class="card"><p style="margin-bottom:.4rem">${u.warn.labor}</p>${doctor ? `<a class="callbtn" href="tel:${p.phone.replace(/[^0-9]/g,'')}"><span>${u.callNow}</span><b>${p.phone}</b></a>` : `<p class="small">${u.choosePrompt}</p><button class="linkbtn" data-focus="doctor">${u.chooseBtn}</button>`}</div><div class="warnlist">`;
  let n = 0;
  for (const t of TOPIC_ORDER) for (const pg of (content.topics[t] || [])) for (const it of pg.items) {
    const tmp = document.createElement('div'); tmp.innerHTML = it.h;
    const found = [];
    tmp.querySelectorAll('.callout.navy').forEach(c => { const h4 = c.querySelector('h4'); const ul = c.querySelector('ul'); if (h4 && ul) found.push(`<h4>${h4.innerHTML}</h4>${ul.outerHTML}`); });
    if (it.t.match(/call|llame|전화|rele/i) && tmp.querySelector('.card-body.callout')) found.push(tmp.querySelector('.card-body.callout').innerHTML);
    if (found.length) h += accordion({t: it.t, h: found.join('')}, n++, true);
  }
  return h + '</div>';
}

function searchHTML(q) {
  const u = UI[lang], terms = q.trim().split(/\s+/).filter(Boolean), lower = terms.map(x => x.toLowerCase());
  let h = `<button class="back" data-go="home">${u.home}</button><h1>${esc(u.results)}</h1><div class="results"><ol>`; let n = 0;
  if (lower.length) for (const t of TOPIC_ORDER) (content.topics[t] || []).forEach((pg, pi) => pg.items.forEach((it, ii) => {
    const tmp = document.createElement('div'); tmp.innerHTML = it.h.replace(/</g, ' <'); const text = (it.t + ' ' + tmp.textContent).replace(/\s+/g, ' ');
    const lt = text.toLowerCase(); if (!lower.every(x => lt.includes(x))) return;
    const idx = lt.indexOf(lower[0]); const a = Math.max(0, idx - 60), b = Math.min(text.length, idx + 120);
    const re = new RegExp('(' + terms.map(x => x.replace(/[.*+?^${}()|[\]\\]/g, '\\$&')).join('|') + ')', 'gi');
    const snip = esc((a > 0 ? '…' : '') + text.slice(a, b) + (b < text.length ? '…' : '')).replace(re, '<mark>$1</mark>');
    h += `<li><button type="button" data-open="${t}|${pi}|${ii}" data-terms="${esc(q)}"><small>${esc(u.topics[t][0])}</small><b>${esc(it.t)}</b><span class="snip">${snip}</span></button></li>`; n++;
  }));
  if (!n) h += `<li><p class="small">${u.noResults}</p></li>`;
  return h + '</ol></div>';
}

function highlight(root, terms) {
  const re = new RegExp('(' + terms.map(t => t.replace(/[.*+?^${}()|[\]\\]/g, '\\$&')).join('|') + ')', 'gi');
  const walker = document.createTreeWalker(root, NodeFilter.SHOW_TEXT, { acceptNode: n => re.test(n.nodeValue) ? NodeFilter.FILTER_ACCEPT : NodeFilter.FILTER_REJECT });
  const nodes = []; while (walker.nextNode()) nodes.push(walker.currentNode);
  nodes.forEach(n => { const frag = document.createDocumentFragment(); n.nodeValue.split(re).forEach((part, i) => { if (i % 2) { const m = document.createElement('mark'); m.textContent = part; frag.appendChild(m); } else if (part) frag.appendChild(document.createTextNode(part)); }); n.parentNode.replaceChild(frag, n); });
}

/* ---------- router ---------- */
function show(id, opts) {
  opts = opts || {};
  const main = $('main'); screen = id;
  document.body.className = practice;
  if (id === 'home') main.innerHTML = homeHTML();
  else if (id === 'team') main.innerHTML = `<button class="back" data-go="home">${UI[lang].home}</button>` + (doctor ? coverHTML() : `<div class="card"><p>${UI[lang].choosePrompt}</p><button class="linkbtn" data-focus="doctor">${UI[lang].chooseBtn}</button></div>`);
  else if (id.startsWith('t-')) main.innerHTML = topicHTML(id.slice(2));
  else if (id === 'week') { main.innerHTML = weekHTML(); renderWeek(); $('due').addEventListener('change', renderWeek); $('due').addEventListener('input', renderWeek); }
  else if (id === 'weight') { main.innerHTML = weightHTML(); main.querySelectorAll('input').forEach(i => i.addEventListener('input', renderWeight)); main.querySelectorAll('[data-u]').forEach(b => b.addEventListener('click', () => { wUnits = b.dataset.u; show('weight'); })); }
  else if (id === 'warn') main.innerHTML = warnHTML();
  else if (id === 'search') main.innerHTML = searchHTML(opts.q || '');
  else { main.innerHTML = homeHTML(); screen = 'home'; }
  main.querySelectorAll('.ph').forEach(el => el.innerHTML = doctor ? telLink(PRACTICES[practice].phone) : UI[lang].yourOffice);
  if (!opts.silent) { try { history.replaceState(null, '', '#' + screen); } catch(e) {} }
  window.scrollTo({top: 0});
}

$('main').addEventListener('click', e => {
  const go = e.target.closest('[data-go]'); if (go) { show(go.dataset.go); return; }
  const f = e.target.closest('[data-focus]'); if (f) { window.scrollTo({top:0}); const sel = $(f.dataset.focus); sel.focus(); try { sel.showPicker(); } catch(err) {} return; }
  const acc = e.target.closest('.acc > button'); if (acc) { const a = acc.parentNode; a.classList.toggle('open'); acc.setAttribute('aria-expanded', a.classList.contains('open')); return; }
  const all = e.target.closest('[data-acc]'); if (all) { $('main').querySelectorAll('.acc').forEach(a => a.classList.toggle('open', all.dataset.acc === 'open')); return; }
  const op = e.target.closest('[data-open]'); if (op) {
    const [t, pi, ii] = op.dataset.open.split('|'); const terms = op.dataset.terms.trim().split(/\s+/);
    show('t-' + t); let idx = 0; for (let k = 0; k < +pi; k++) idx += content.topics[t][k].items.length; idx += +ii;
    const a = $('main').querySelector(`.acc[data-i="${idx}"]`); if (a) { a.classList.add('open'); highlight(a, terms); setTimeout(() => a.scrollIntoView({block:'start', behavior:'smooth'}), 50); }
  }
});
$('homeBtn').addEventListener('click', () => show('home'));
$('appName').addEventListener('click', () => show('home'));
$('searchForm').addEventListener('submit', e => { e.preventDefault(); show('search', {q: $('q').value}); });
$('doctor').addEventListener('change', e => { doctor = e.target.value; practice = doctor ? docById(doctor).p : 'wch'; try { localStorage.setItem('hn_doctor', doctor); } catch(err) {} show('home'); });
$('lang').addEventListener('change', e => { lang = e.target.value; try { localStorage.setItem('hn_lang', lang); } catch(err) {} loadLang(); });
window.addEventListener('hashchange', () => { const id = location.hash.slice(1); if (id && id !== screen) show(id, {silent:true}); });

async function loadLang() {
  const s = STR[lang], u = UI[lang];
  document.documentElement.lang = lang;
  $('appName').textContent = s.app; $('lblPractice').textContent = s.practice; $('lblLang').textContent = s.language;
  $('q').placeholder = s.searchPh; $('searchBtn').textContent = s.search; $('homeBtn').setAttribute('aria-label', u.home);
  document.title = 'Holy Name ' + s.app; buildDoctorSelect();
  $('main').innerHTML = `<div class="loading">${s.loading}</div>`;
  try { const r = await fetch(`content/${lang}.json`, {cache:'no-cache'}); if (!r.ok) throw new Error(r.status); content = await r.json(); }
  catch (e) { content = {topics:{}}; }
  const id = location.hash.slice(1) || 'home';
  show(id === 'search' ? 'home' : id, {silent:true});
}
loadLang();

</script>
